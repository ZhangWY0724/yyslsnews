[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yysls-news"
version = "0.1.0"
description = "B站与燕云十六声资讯监控及QQ机器人图片推送服务"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "bilibili-api-python>=17.4.2,<18",
    "cryptography>=43,<47",
    "fastapi>=0.115,<1",
    "httpx[socks]>=0.27,<1",
    "jinja2>=3.1,<4",
    "playwright>=1.50,<2",
    "python-dotenv>=1.0,<2",
    "qrcode[pil]>=8,<9",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=14,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
yysls-news = "yysls_news.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yysls_news = ["web/templates/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
