<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
    .card { width: min(100%, 440px); padding: 32px; border: 1px solid #e7ebf3; border-radius: 14px; background: #fff; box-shadow: 0 12px 32px rgba(30, 48, 86, .08); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand-mark { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #5c86ff, #3152c9); font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0 0 22px; color: #758098; font-size: 13px; line-height: 1.7; }
    label { display: block; margin: 16px 0 7px; color: #536078; font-size: 13px; font-weight: 650; }
    input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #dce2ef; border-radius: 8px; font: inherit; }
    input:focus { outline: 2px solid rgba(53, 104, 245, .18); border-color: #3568f5; }
    button { width: 100%; height: 40px; margin-top: 22px; border: 0; border-radius: 8px; color: #fff; background: #3568f5; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .65; }
    .message { min-height: 22px; margin: 14px 0 0; font-size: 13px; }
    .message.error { color: #d04b56; }
    .message.success { color: #1f9d68; }
    .tip { margin: 20px 0 0; padding: 11px 12px; border-radius: 8px; color: #758098; background: #f5f7fb; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><div class="brand-mark">Y</div><strong>资讯监控中心</strong></div>
    <h1>首次登录，请修改管理密码</h1>
    <p>当前使用的是部署时生成的初始密码。修改完成后，后续登录请使用新密码。</p>
    <form id="password-form">
      <label for="new-password">新密码</label>
      <input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <label for="confirm-password">确认新密码</label>
      <input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      <button id="submit-button" type="submit">保存新密码</button>
    </form>
    <div class="message" id="message" role="status"></div>
    <div class="tip">密码长度至少 8 位。保存成功后，浏览器可能会再次弹出登录框，请输入新密码。</div>
  </main>
  <script>
    document.querySelector('#password-form').addEventListener('submit', async function(event) {
      event.preventDefault();
      var button = document.querySelector('#submit-button');
      var message = document.querySelector('#message');
      var newPassword = document.querySelector('#new-password').value;
      var confirmPassword = document.querySelector('#confirm-password').value;
      message.className = 'message';
      message.textContent = '';
      if (newPassword !== confirmPassword) {
        message.className = 'message error';
        message.textContent = '两次输入的新密码不一致。';
        return;
      }
      button.disabled = true;
      try {
        var response = await fetch('/api/auth/password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({new_password: newPassword, confirm_password: confirmPassword})
        });
        var data = await response.json();
        if (!response.ok) throw new Error(data.detail || '密码修改失败');
        message.className = 'message success';
        message.textContent = '密码已修改，请刷新页面并使用新密码登录。';
        document.querySelector('#password-form').reset();
      } catch (error) {
        message.className = 'message error';
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
