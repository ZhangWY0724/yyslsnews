<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei", "Noto Serif CJK SC", serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f2f4; color: #252525; }
    #capture { width: 1080px; padding: 48px 64px; background: #fff; }
    .category { color: #a77b3e; font-size: 18px; letter-spacing: 2px; }
    h1 { margin: 14px 0 10px; font-size: 38px; line-height: 1.35; }
    .meta { color: #8d8d8d; font-size: 17px; }
    .article { margin-top: 36px; font-size: 22px; line-height: 1.85; }
    .article :where(p) { margin: 0 0 20px; }
    .article :where(img) { display: block; max-width: 100%; height: auto; margin: 24px auto; }
    .source { margin-top: 42px; padding-top: 18px; border-top: 1px solid #e5e5e5; color: #999; font: 15px/1.5 "Microsoft YaHei", sans-serif; word-break: break-all; }
  </style>
</head>
<body>
  <main id="capture">
    <div class="category">{{ payload.category or "新闻" }}</div>
    <h1>{{ payload.title }}</h1>
    <div class="meta">{{ payload.published_at or "" }} · 燕云十六声官网</div>
    <article class="article">{{ payload.content_html | safe }}</article>
    <div class="source">原文：{{ payload.source_url }}</div>
  </main>
</body>
</html>
