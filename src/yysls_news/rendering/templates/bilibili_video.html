<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        width: 1920px;
        padding: 80px 0;
        color: #182333;
        background: #eaf0f8;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }
      .bilibili-video-card {
        width: 1560px;
        min-height: 880px;
        margin: 0 auto;
        padding: 64px 72px;
        overflow: hidden;
        border: 1px solid #dce5f0;
        border-radius: 30px;
        background: linear-gradient(135deg, #ffffff 0%, #f8fbff 62%, #e8f4ff 100%);
        box-shadow: 0 28px 80px rgba(35, 58, 91, 0.16);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 48px;
        color: #53657b;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 38px;
        border-radius: 12px;
        color: #fff;
        background: #00a1d6;
        font-size: 20px;
        letter-spacing: 0;
      }
      .content {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        align-items: center;
        gap: 62px;
      }
      .copy { min-width: 0; padding: 8px 0; }
      .eyebrow {
        margin-bottom: 22px;
        color: #00a1d6;
        font-size: 25px;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 32px;
        color: #182333;
        font-size: 48px;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .description {
        color: #48576a;
        font-size: 27px;
        line-height: 1.75;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .video-link {
        display: inline-block;
        margin-top: 42px;
        padding: 16px 26px;
        border-radius: 14px;
        color: #fff;
        background: #00a1d6;
        font-size: 22px;
        font-weight: 700;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .video-cover {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin: 0;
        overflow: hidden;
        border-radius: 24px;
        background: linear-gradient(135deg, #dcecf8, #b8d7eb);
      }
      .video-cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cover-placeholder {
        color: #55718a;
        font-size: 28px;
        font-weight: 600;
      }
      .play-icon {
        position: absolute;
        top: 50%;
        left: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 92px;
        height: 92px;
        padding-left: 7px;
        transform: translate(-50%, -50%);
        border: 3px solid rgba(255, 255, 255, 0.88);
        border-radius: 50%;
        color: #fff;
        background: rgba(0, 0, 0, 0.42);
        font-size: 38px;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 58px;
        color: #8a99aa;
        font-size: 18px;
      }
      .qrcode {
        display: flex;
        align-items: center;
        gap: 16px;
        color: #53657b;
        font-size: 20px;
        font-weight: 600;
      }
      .qrcode img {
        display: block;
        width: 112px;
        height: 112px;
      }
    </style>
  </head>
  <body>
    <main class="bilibili-video-card">
      <div class="brand"><span class="brand-mark">哔</span> BILIBILI 动态速报</div>
      <section class="content">
        <div class="copy">
          <div class="eyebrow">{{ author }} 投稿了新视频</div>
          <h1>{{ title }}</h1>
          {% if body_text %}<div class="description">{{ body_text }}</div>{% endif %}
          {% if video_url %}<a class="video-link" href="{{ video_url }}">打开视频 · {{ video_url }}</a>{% endif %}
        </div>
        <figure class="video-cover">
          {% if cover_url %}
          <img src="{{ cover_url }}" alt="视频封面">
          {% else %}
          <div class="cover-placeholder">视频封面暂不可用</div>
          {% endif %}
          <span class="play-icon">▶</span>
        </figure>
      </section>
      <div class="footer">
        <span>视频动态卡片 · 内容来自 Bilibili 公开动态数据</span>
        {% if qrcode_url %}
        <div class="qrcode">
          <img src="{{ qrcode_url }}" alt="视频二维码">
          <span>扫码观看</span>
        </div>
        {% endif %}
      </div>
    </main>
  </body>
</html>
